<div class="project-container">
  <app-projects-list (selectedProject)="p=$event"></app-projects-list>
  @if(p) {
    <app-project-title [selectedProject]="p"></app-project-title>
    <app-project-task-list [selectedProject]="p"></app-project-task-list>
    <app-progress-bar [progress]="p.progress"></app-progress-bar>
  }
</div>
