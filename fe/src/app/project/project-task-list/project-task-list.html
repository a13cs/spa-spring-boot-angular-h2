<div class="task-list-container">
  <div class="heading">
    <h3>Tasks</h3>
    <div>
      <span class="status-dot in-progress"></span>In Progress
      <span class="status-dot completed"></span> Completed
    </div>
  </div>
  <table>
    <thead>
      <tr>
        <th>Task</th>
        <th>Status</th>
        <th>Due date</th>
        <th>Edit</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody>
      @for(task of project().tasks; track task.id)
      {
      <tr>
        <td>
          <label class="{{task.completed ? 'completed-task' : ''}}">
            <input (click)="handleCheckbox(task.id)" type="checkbox" aria-label="Select task" [checked]="task.completed"/>
            {{ task.name }}
          </label>
        </td>
        <td>
          <span class="status-dot {{task.completed ? 'completed' : 'in-progress'}}"></span>
          {{ task.completed ? 'Completed' : 'In Progress'}}
        </td>
        <td>
          {{ task.dueDate | date:'yyyy-MM-dd' }}
        </td>
        <td> <label (click)="updateTask(task)" > ✏️ </label> </td>
        <td> <label (click)="deleteTask(task.id)" > ❌</label> </td>
      </tr>
      }
      @if(project().id) {
        <div>
          <button class="button-container" (click)="showModal = true" >Add new Task</button>
        </div>
      }
      @if(showModal){
        <app-task-form
          (formCancel)="showModal = false"
          (formSubmit)="showModal = false; project().tasks.push($event)"
          [currentProjectId]="project().id">
        </app-task-form>
      }
    </tbody>
  </table>
</div>
