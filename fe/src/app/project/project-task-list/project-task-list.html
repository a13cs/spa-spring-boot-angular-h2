<div class="task-list-container">
  <div class="heading">
    <h3>Tasks</h3>
    <div>
      <span class="status-dot in-progress"></span>In Progress
      <span class="status-dot completed"></span> Completed
    </div>
  </div>
  <table>
    <thead>
      <tr>
        <th>Task</th>
        <th>Status</th>
        <th>Due date</th>
      </tr>
    </thead>
    <tbody>
      @for(task of project().tasks; track task.id){
      <tr>
        <td>
          <label class="{{task.completed ? 'completed-task' : ''}}">
            <input (click)="handleCheckbox(task.id)" type="checkbox" aria-label="Select task" [checked]="task.completed"/>
            {{ task.name }}
          </label>
        </td>
        <td>
          <span class="status-dot {{task.completed ? 'completed' : 'in-progress'}}"></span>
          {{ task.completed ? 'Completed' : 'In Progress'}}
        </td>
        <td>
          {{ task.dueDate | date:'yyyy-MM-dd' }}
        </td>
        <td> <label (click)="deleteTask(task.id)" > <button>x</button> </label> </td>
      </tr>
    }
    </tbody>
  </table>
</div>
