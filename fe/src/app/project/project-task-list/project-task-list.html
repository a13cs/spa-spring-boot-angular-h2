<div class="task-list-container">

  {{ p$ | async | json }}

  <div class="heading">
    <h3>Tasks</h3>
    <div>
      <span class="status-dot in-progress"></span>In Progress
      <span class="status-dot completed"></span> Completed
    </div>
  </div>
  <table>
    <thead>
      <tr>
        <th>Task</th>
        <th>Status</th>
        <th>Due date</th>
      </tr>
    </thead>
    <tbody>
      @for(task of project.tasks; track project.id){
      <tr>
        <td>
          <label>
            <input type="checkbox" aria-label="Select task" [checked]="task.completed"/>
            {{ task.name }}
          </label>
        </td>
        <td>
          {{ task.completed ? 'Completed' : 'In Progress'}}
        </td>
        <td>
          {{ task.dueDate | date:'yyyy-MM-dd' }}
        </td>
      </tr>
    }
    </tbody>
  </table>
</div>
